services:
  - type: web
    name: php-api
    env: docker
    plan: free  # or starter, standard, pro
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: postgres-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: postgres-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: postgres-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: postgres-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: postgres-db
          property: password
      - key: API_KEY
        generateValue: true
      - key: APP_ENV
        value: production

databases:
  - name: postgres-db
    plan: free  # or starter, standard, pro
    databaseName: api_db
    user: api_user